- baseInfo:
    api_name: 接收订单
    url: /api/order/pc/order/master/receive
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
    cookies: ${get_extract_data(Cookie)}
  testCase:
    - case_name: 正常接收订单
      json:
        orderId: ${get_extract_data(orderId)}
      validation:
        - contains: { 'message': '操作成功' }