- baseInfo:
    api_name: 货主（托运人）下订单 
    url: /api/order/customer/orderPlan/create
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
    cookies: ${get_extract_data(Cookie)}
  testCase:
    - case_name: 正常下订单
      json: 
        orderInfo:
          template: define
          urgentType: 2
          cusName: 总仓
          orderType: 1
          charter: 2
          planType: 1
          transStartTime: ${end_time()}
          transEndTime: ${start_after_time()}
          orderMark: 货主下单
          cusId: 1661242770195464193
        orderCapacityList:
        - materialCategoryId: ${get_extract_data(materialId,0)}
          materialCategory: 粮食
          materialName: 小麦
          materialUnit: KG
          materialUnitId: 1660891402561581058
          settlementUnit: KG
          syncMaterialId: 4
          billingWeightCoe: null
          billingVolumeCoe: null
          sendWeightCoe: null
          sendVolumeCoe: null
          materialId: 1661349087048306690
          sendCusId: 1661663745663741954
          sendCusName: 码头尖庄仓
          receiveCusId: 1661624733406285825
          receiveCusName: 502车间
          sendAdrId: 1674617286107828226
          sendAdrName: 长宁县五谷粮食购销有限责任公司
          sendPoId: 1674615819826425857
          sendAdrDetail: null
          receiveAdrId: 1674208708683337730
          receiveAdrName: 五区一区
          receivePoId: 1674208399906237313
          receiveAdrDetail: 五区一区
          materialSpecList:
            - materialSpecId: 1661349088147214337
              specName: "1"
              materialNum: 100
              materialSpecUnit: KG
              remark: 原粮
        orderVehicleList:
          -
        orderBoxList:
          -
      validation:
        - contains: { 'message': '操作成功' }
        - eq: { 'code': 20000 }
      extract:
        orderId: $.orderNo